<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0d0a07" />
    <title>DIODI LED — Light of things</title>
    <meta
      name="description"
      content="Estilo, diseño y asesoría en iluminación para interiores y exteriores. Explora el catálogo de DIODI en 3D. Valencia y Caracas."
    />
    <meta property="og:title" content="DIODI LED — Light of things" />
    <meta property="og:description" content="Estilo, diseño y asesoría en iluminación. Explora cada luminaria en 3D." />
    <meta property="og:image" content="/renders/escena-interior-luz.webp" />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      /* Pantalla de carga: el isotipo de DIODI con sus triángulos en movimiento. */
      html {
        background: #0d0a07;
      }
      #loader {
        position: fixed;
        inset: 0;
        z-index: 200;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 0;
        background: #0d0a07;
        color: #efe6d5;
        font-family: 'Montserrat Variable', 'Helvetica Neue', Arial, sans-serif;
        transition:
          opacity 0.75s cubic-bezier(0.4, 0, 0.2, 1) 0.2s,
          visibility 0s 1s;
      }
      #loader svg {
        width: 104px;
        height: auto;
        overflow: visible;
        transition: transform 0.95s cubic-bezier(0.7, 0, 0.84, 0);
        transform-origin: 50% 66%;
      }
      .ld-outer,
      .ld-inner {
        stroke-dasharray: 1;
        stroke-dashoffset: 1;
        animation: ld-draw 1.1s cubic-bezier(0.65, 0, 0.35, 1) forwards;
      }
      .ld-inner {
        animation-delay: 0.35s;
        animation-duration: 0.9s;
      }
      .ld-rise {
        opacity: 0;
        animation: ld-in 0.6s ease 0.9s forwards;
      }
      .ld-rise path {
        vector-effect: non-scaling-stroke;
        stroke-width: 1.15px;
        transform-origin: 50px 77px;
        animation: ld-rise 2.6s linear infinite;
        animation-delay: calc(var(--i) * -0.52s);
      }
      #loader p {
        margin: 0;
        opacity: 0;
        animation: ld-up 0.8s cubic-bezier(0.22, 0.61, 0.36, 1) forwards;
      }
      .ld-word {
        margin-top: 30px !important;
        padding-left: 0.5em;
        font-weight: 600;
        font-size: 17px;
        letter-spacing: 0.5em;
        animation-delay: 0.55s !important;
      }
      .ld-sig {
        margin-top: 12px !important;
        padding-left: 0.46em;
        font-weight: 500;
        font-size: 10px;
        letter-spacing: 0.46em;
        text-transform: uppercase;
        color: rgba(239, 230, 213, 0.6);
        animation-delay: 0.85s !important;
      }
      #loader.is-leaving {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      #loader.is-leaving svg {
        transform: scale(16);
      }
      #loader.is-leaving p {
        transition: opacity 0.25s;
        opacity: 0 !important;
        animation: none;
      }
      @keyframes ld-draw {
        to {
          stroke-dashoffset: 0;
        }
      }
      @keyframes ld-in {
        to {
          opacity: 1;
        }
      }
      @keyframes ld-up {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes ld-rise {
        0% {
          transform: scaleY(0.06);
          opacity: 0;
        }
        14% {
          opacity: 0.95;
        }
        78% {
          opacity: 0.95;
        }
        100% {
          transform: scaleY(1);
          opacity: 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .ld-outer,
        .ld-inner {
          animation: none;
          stroke-dashoffset: 0;
        }
        .ld-rise {
          animation: none;
          opacity: 1;
        }
        .ld-rise path {
          animation: none;
          transform: scaleY(calc(0.2 + var(--i) * 0.18));
        }
        #loader p {
          animation: none;
          opacity: 1;
        }
        #loader svg {
          transition: none;
        }
        #loader.is-leaving svg {
          transform: none;
        }
      }
    </style>
    <noscript
      ><style>
        #loader {
          display: none;
        }
      </style></noscript
    >
  </head>
  <body>
    <div id="loader" role="status" aria-label="Cargando DIODI">
      <svg viewBox="0 0 100 90" fill="none" stroke="currentColor" aria-hidden="true">
        <path class="ld-outer" pathLength="1" d="M50 5 96 85H4Z" stroke-width="5.5" />
        <path class="ld-inner" pathLength="1" d="M50 27 79.5 77h-59Z" stroke-width="2.6" />
        <g class="ld-rise">
          <path style="--i: 0" d="M20.5 77 50 27 79.5 77" />
          <path style="--i: 1" d="M20.5 77 50 27 79.5 77" />
          <path style="--i: 2" d="M20.5 77 50 27 79.5 77" />
          <path style="--i: 3" d="M20.5 77 50 27 79.5 77" />
          <path style="--i: 4" d="M20.5 77 50 27 79.5 77" />
        </g>
      </svg>
      <p class="ld-word">DIODI</p>
      <p class="ld-sig">Light of things</p>
    </div>
    <script>
      // Red de seguridad: si algo impide arrancar la app, la pantalla de carga no se queda para siempre.
      setTimeout(function () {
        var el = document.getElementById('loader');
        if (el) el.classList.add('is-leaving');
      }, 12000);
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
