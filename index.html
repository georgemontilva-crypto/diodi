<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0d0a07" />
    <title>DIODI LED — Light of things</title>
    <meta
      name="description"
      content="Estilo, diseño y asesoría en iluminación para interiores y exteriores. Explora el catálogo de DIODI en 3D. Valencia y Caracas."
    />
    <meta property="og:title" content="DIODI LED — Light of things" />
    <meta property="og:description" content="Estilo, diseño y asesoría en iluminación. Explora cada luminaria en 3D." />
    <meta property="og:image" content="/renders/escena-interior-luz.webp" />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      /* Pantalla de carga: el isotipo de DIODI con sus triángulos en movimiento.
         Cada triángulo es una capa propia animada solo con transform y opacity:
         la mueve el compositor del navegador, así que no se traba aunque el hilo
         principal esté ocupado montando el 3D. */
      html {
        background: #0d0a07;
      }
      #loader {
        position: fixed;
        inset: 0;
        z-index: 200;
        display: grid;
        place-content: center;
        justify-items: center;
        background: #0d0a07;
        color: #efe6d5;
        font-family: 'Montserrat Variable', 'Helvetica Neue', Arial, sans-serif;
        will-change: opacity;
        transition:
          opacity 0.75s cubic-bezier(0.4, 0, 0.2, 1) 0.2s,
          visibility 0s 1s;
      }
      .ld-mark {
        position: relative;
        width: 104px;
        height: 93.6px;
        transform-origin: 50% 66%;
        will-change: transform;
        transition: transform 0.95s cubic-bezier(0.7, 0, 0.84, 0);
      }
      .ld-mark svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: visible;
        will-change: transform, opacity;
        backface-visibility: hidden;
      }
      .ld-outer,
      .ld-inner {
        opacity: 0;
        transform: scale(0.86);
        transform-origin: 50% 62%;
        animation: ld-pop 1s cubic-bezier(0.16, 1, 0.3, 1) 0.05s forwards;
      }
      .ld-mark .ld-inner {
        animation-delay: 0.3s;
      }
      .ld-rise {
        position: absolute;
        inset: 0;
        opacity: 0;
        will-change: opacity;
        animation: ld-in 0.7s ease 0.75s forwards;
      }
      .ld-rise svg {
        transform-origin: 50% 85.556%;
        animation: ld-rise 2.6s linear infinite both;
        animation-delay: calc(var(--i) * -0.52s);
      }
      #loader p {
        margin: 0;
        opacity: 0;
        will-change: transform, opacity;
        animation: ld-up 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      #loader .ld-word {
        margin-top: 30px;
        padding-left: 0.5em;
        font-weight: 600;
        font-size: 17px;
        letter-spacing: 0.5em;
        animation-delay: 0.5s;
      }
      #loader .ld-sig {
        margin-top: 12px;
        padding-left: 0.46em;
        font-weight: 500;
        font-size: 10px;
        letter-spacing: 0.46em;
        text-transform: uppercase;
        color: rgba(239, 230, 213, 0.6);
        animation-delay: 0.8s;
      }
      #loader.is-leaving {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      #loader.is-leaving .ld-mark {
        transform: scale(16);
      }
      #loader.is-leaving p {
        animation: ld-out 0.25s ease forwards;
      }
      @keyframes ld-pop {
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes ld-in {
        to {
          opacity: 1;
        }
      }
      @keyframes ld-up {
        from {
          opacity: 0;
          transform: translate3d(0, 10px, 0);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes ld-out {
        from {
          opacity: 1;
        }
        to {
          opacity: 0;
        }
      }
      @keyframes ld-rise {
        0% {
          transform: scale3d(1, 0.06, 1);
          opacity: 0;
        }
        14% {
          opacity: 0.95;
        }
        78% {
          opacity: 0.95;
        }
        100% {
          transform: scale3d(1, 1, 1);
          opacity: 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .ld-mark .ld-outer,
        .ld-mark .ld-inner,
        .ld-rise,
        #loader p {
          animation: none;
          opacity: 1;
          transform: none;
        }
        .ld-rise svg {
          animation: none;
          opacity: 0.9;
          transform: scale3d(1, calc(0.2 + var(--i) * 0.18), 1);
        }
        .ld-mark {
          transition: none;
        }
        #loader.is-leaving .ld-mark {
          transform: none;
        }
      }
    </style>
    <noscript>
      <style>
        #loader {
          display: none;
        }
      </style>
    </noscript>
  </head>
  <body>
    <div id="loader" role="status" aria-label="Cargando DIODI">
      <div class="ld-mark" aria-hidden="true">
        <svg class="ld-outer" viewBox="0 0 100 90" fill="none" stroke="currentColor" stroke-width="5.5">
          <path d="M50 5 96 85H4Z" />
        </svg>
        <svg class="ld-inner" viewBox="0 0 100 90" fill="none" stroke="currentColor" stroke-width="2.6">
          <path d="M50 27 79.5 77h-59Z" />
        </svg>
        <div class="ld-rise">
          <svg style="--i: 0" viewBox="0 0 100 90" fill="none" stroke="currentColor" stroke-width="1.25">
            <path d="M20.5 77 50 27 79.5 77" />
          </svg>
          <svg style="--i: 1" viewBox="0 0 100 90" fill="none" stroke="currentColor" stroke-width="1.25">
            <path d="M20.5 77 50 27 79.5 77" />
          </svg>
          <svg style="--i: 2" viewBox="0 0 100 90" fill="none" stroke="currentColor" stroke-width="1.25">
            <path d="M20.5 77 50 27 79.5 77" />
          </svg>
          <svg style="--i: 3" viewBox="0 0 100 90" fill="none" stroke="currentColor" stroke-width="1.25">
            <path d="M20.5 77 50 27 79.5 77" />
          </svg>
          <svg style="--i: 4" viewBox="0 0 100 90" fill="none" stroke="currentColor" stroke-width="1.25">
            <path d="M20.5 77 50 27 79.5 77" />
          </svg>
        </div>
      </div>
      <p class="ld-word">DIODI</p>
      <p class="ld-sig">Light of things</p>
    </div>
    <script>
      // Red de seguridad: si algo impide arrancar la app, la pantalla de carga no se queda para siempre.
      setTimeout(function () {
        var el = document.getElementById('loader');
        if (el) el.classList.add('is-leaving');
        document.documentElement.classList.add('is-ready');
      }, 12000);
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
